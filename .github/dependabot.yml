# Keeps Rust crates, the Tauri CLI and the SHA-pinned GitHub Actions up to date.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
