[package]
name = "openreleasepilot"
version = "0.1.0"
edition = "2021"
license = "MIT"
default-run = "openreleasepilot"

[[bin]]
name = "openreleasepilot"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openreleasepilot-core = { path = "../core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
