name: Release

# A tag like 0.2.0 builds the app and publishes it; 0.2.0-beta.1 becomes a pre-release.
# The release is only created after tests and build are green (release gate).
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRE=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && PRE=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/OpenFTPUpdater-AI-"$GITHUB_REF_NAME"-* \
            --title "OpenFTPUpdater-AI $GITHUB_REF_NAME" --generate-notes "${PRE[@]}"
