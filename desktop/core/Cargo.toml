[package]
name = "openreleasepilot-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.23"
dirs = "6"
hex = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
libc = "0.2"
minisign-verify = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
ureq = "2"
walkdir = "2"
