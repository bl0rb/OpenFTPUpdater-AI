  <title id="openftpupdater-flow-de-title">OpenFTPUpdater-AI: Ablauf eines Website-Updates</title>
  <desc id="openftpupdater-flow-de-desc">Swimlane-Diagramm: Precheck vergleicht Releases, bei neuen Releases arbeitet Claude Code die gewählten Aufgaben-Skills ab, die App baut und committet, pusht und lädt geänderte Dateien per SFTP hoch und prüft die Live-Seite; ein neues Produkt nimmt Claude mit dem Skill product-add auf.</desc>
